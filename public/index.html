<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Envoyer un fichier</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin-top: 100px; background-color: #f4f4f4; }
    .container { background: white; padding: 40px; border-radius: 10px; display: inline-block; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
    h1 { color: #333; }
    input[type="file"] { margin: 20px 0; display: block; margin-left: auto; margin-right: auto; }
    button {
      background-color: #28a745;
      color: white;
      border: none;
      padding: 15px 30px;
      border-radius: 5px;
      font-size: 18px;
      cursor: pointer;
    }
    button:hover { background-color: #218838; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Héberger un fichier</h1>
    <p>Sélectionnez un fichier et obtenez un lien unique.</p>
    <form action="/upload" method="post" enctype="multipart/form-data">
      <input type="file" name="file" required>
      <button type="submit">Téléverser et obtenir le lien</button>
    </form>
  </div>
</body>
</html>
